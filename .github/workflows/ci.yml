name: ci
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r apps/api/requirements.txt && python -m playwright install --with-deps chromium
      - run: python scripts/sync_readme.py --check
      - run: python scripts/build_system_design.py --check
      - run: ruff check apps/api/app
      - run: cd apps/api && python -m pytest -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - run: cd apps/web && npm ci && npx tsc --noEmit && npx eslint . && npx next build
