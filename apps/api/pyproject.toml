[project]
name = "redeem-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "python-multipart>=0.0.9",
  "fastapi>=0.115", "uvicorn>=0.30", "sqlalchemy>=2.0", "pydantic>=2.7",
  "pydantic-settings>=2.3", "argon2-cffi>=23.1", "httpx>=0.27", "alembic>=1.13",
  "psycopg[binary]>=3.1; extra == 'postgres'",
]
[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
postgres = ["psycopg[binary]>=3.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501", "E701", "E702", "E731"]
